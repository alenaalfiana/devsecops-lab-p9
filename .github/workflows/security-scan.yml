name: Container Security Scan

# Trigger: scan otomatis pada push dan pull request
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-scan:
    name: Build & Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Build Docker image
      - name: Build Docker image
        run: |
          docker build -f Dockerfile.secure \
            -t my-app:${{ github.sha }} .

      # 3. Jalankan Trivy untuk scan image
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "my-app:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"  # Gagalkan pipeline jika ada CVE kritis

      # 4. Upload hasil SARIF ke GitHub Security tab
      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()  # Upload meskipun step sebelumnya gagal
        with:
          sarif_file: "trivy-results.sarif"
          category: "container-scanning"
